<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>EQMUX</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <header class="bar">
        <span class="brand">EQMUX</span>
        <span class="ver" id="ver">—</span>
        <span class="badge" id="mode">확인 중</span>
      </header>

      <!-- 터미널. S2에서 이 자리를 레이아웃 트리가 가져간다. -->
      <div class="term" id="term"></div>

      <!-- 렌더 경로를 항상 보이게 둔다. 조용한 DOM 폴백이 제일 위험하다. -->
      <footer class="status">
        <span class="rend" id="renderer">렌더러 확인 중…</span>
        <span class="gpu" id="gpu"></span>
        <span class="lat" id="latency" hidden></span>
      </footer>
    </main>
  </body>
</html>
