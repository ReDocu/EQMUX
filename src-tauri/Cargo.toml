[package]
name = "eqmux"
version = "0.3.0"
description = "EQMUX — 멀티 에이전트 관제 MUX"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
notify = "6"
chrono = "0.4"
tauri-plugin-notification = "2"
trash = "5" # 탐색기 삭제(M24)는 영구 삭제가 아니라 휴지통으로 보낸다

[target.'cfg(windows)'.dependencies]
# 웹뷰 렌더러 크래시 생존 (FR-C-06) — wry가 쓰는 것과 같은 버전으로 고정해 COM 타입을 공유한다
webview2-com = "0.38"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug", # ReadProcessMemory — 에이전트 감지의 명령줄 읽기
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lib]
name = "eqmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
