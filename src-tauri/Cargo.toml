[package]
name = "eqmux"
version = "0.1.0"
description = "EQMUX — 멀티 에이전트 관제 MUX"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "eqmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
