[package]
name = "eqmux"
version = "0.6.2"
description = "EQMUX — 멀티 에이전트 관제 MUX"
edition = "2021"
default-run = "eqmux" # 콘솔 대리인(src/bin/eqmux-console.rs, B248)이 두 번째 bin이다
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable — 브라우저 패널의 자식 웹뷰(Window::add_child, M17 확장)가 이 플래그 뒤에 있다
# tray-icon — 창을 닫아도 세션이 도는 동안 트레이에 남는다 (0.6 §1-1, tray.rs)
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
notify = "6"
chrono = "0.4"
tauri-plugin-notification = "2"
trash = "5" # 탐색기 삭제(M24)는 영구 삭제가 아니라 휴지통으로 보낸다
vt100 = "0.18"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
# 웹뷰 렌더러 크래시 생존 (FR-C-06) — wry가 쓰는 것과 같은 버전으로 고정해 COM 타입을 공유한다
webview2-com = "0.38"
# ICoreWebView2 → _19 cast (R1 메모리 목표) — webview2-com이 쓰는 0.61 그대로, 새로 받는 것 없음
windows-core = "0.61"
# 알림 클릭 → 페인 (P2 · 필요 기능 A2) — 알림 플러그인이 이미 쓰는 그 크레이트. 플러그인은 활성화 콜백을 내주지 않는다
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console", # AttachConsole — GUI 서브시스템에서도 CLI 오류를 부모 콘솔에 낸다
    "Win32_UI_WindowsAndMessaging", # 두 번째 인스턴스가 기존 창을 앞으로 끌어온다
    "Win32_UI_Shell", # SetWindowSubclass — 로그오프·시스템 종료(WM_QUERYENDSESSION) 정리 (quit.rs)
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug", # ReadProcessMemory — 에이전트 감지의 명령줄 읽기
    "Win32_System_Diagnostics_ToolHelp", # 프로세스 스냅숏 — 세션 잡을 벗어난 자손 찾기 (job.rs tree_pids)
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# 세션 트리·포트 귀속·에이전트 감지 (macproc.rs) — libproc·sysctl
libc = "0.2"
# 브라우저 패널 조종 (browser.rs eval_text) — WKWebView evaluateJavaScript. wry가 쓰는 것과 같은 버전
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "block2"] }
block2 = "0.6"

# 릴리스 빌드 (최적화 B11) — exe 크기·속도. panic = "abort"는 넣지 않는다: 연결·리더 스레드의
# panic이 그 스레드에서 끝나야 앱이 산다 (크래시 생존 경로)
[profile.release]
lto = true
codegen-units = 1
strip = true

# 개발 빌드의 의존성만 최적화한다 (0.6 §6) — 우리 크레이트는 디버그 그대로라 증분 빌드는 빠르고,
# SQLite·ConPTY·웹뷰 쪽이 개발 중에도 릴리스에 가까운 속도로 돈다. 릴리스에는 영향이 없다
[profile.dev.package."*"]
opt-level = 2

[lib]
name = "eqmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
