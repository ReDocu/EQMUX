# 0.6 §9-1 — Windows(포터블 zip · NSIS) + macOS(universal dmg)를 GitHub 호스팅 러너에서 빌드한다.
# v* 태그를 밀면 두 플랫폼 산출물과 SHA256SUMS.txt를 붙인 **초안** 릴리스를 만든다. 공개는 사람이 누른다.
# 서명: SignPath(Windows) · Developer ID(macOS)는 계정이 준비되면 아래 "서명 자리"에 붙인다.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test --lib
        working-directory: src-tauri

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run tauri build
      # 서명 자리: SignPath 서명 단계(signpath/github-action-submit-signing-request)를 여기에 둔다.
      - name: portable zip
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out, stage\EQMUX | Out-Null
          Copy-Item src-tauri\target\release\eqmux.exe stage\EQMUX\
          Compress-Archive -Path stage\EQMUX -DestinationPath "out\EQMUX_${v}_x64_portable.zip" -Force
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe out\
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # ad-hoc 서명(tauri.macos.conf.json signingIdentity "-"). 서명 자리: Developer ID + notarytool(결정 P1).
      - run: npm run tauri build -- --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "EQMUX ${GITHUB_REF_NAME#v}" --notes "릴리스 노트는 사람이 채운다."
